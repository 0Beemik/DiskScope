name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (for the similar-media tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installer lint
        run: bash -n install.sh && shellcheck install.sh
      - name: Installer round trip
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          sleep 1
          DISKSCOPE_RAW=http://127.0.0.1:8765 bash install.sh
          ~/.local/bin/diskscope --version
          DISKSCOPE_RAW=http://127.0.0.1:8765 bash install.sh --uninstall
          test ! -e ~/.local/bin/diskscope
